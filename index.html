<title>laVital START Antrag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Cabin:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style id="page-style">
  :root{
    --navy:#002680;
    --navy-deep:#05091c;
    --surface:#101c4c;
    --surface-raised:#182864;
    --surface-border:#26398a;
    --orange:#ff8000;
    --orange-ink:#3a1b00;
    --steel:#7a93cc;
    --ink:#f4f6fc;
    --ink-dim:#aab6dd;
  }
  *{box-sizing:border-box;}
  html{-webkit-overflow-scrolling:touch;}
  body{
    margin:0;
    background:var(--navy-deep);
    color:var(--ink);
    font-family:"Cabin", system-ui, sans-serif;
    overflow-x:hidden;
  }

  section{
    padding:52px 24px;
    max-width:920px;
    margin:0 auto;
  }
  @media (max-width:480px){
    section{ padding:36px 20px; }
  }

  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1);
  }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
  }

  .eyebrow{
    font-family:"Oswald", sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--steel);
  }

  /* ---- HERO ---- */
  .hero{
    min-height:92vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    padding:60px 24px;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(255,128,0,0.16), transparent 60%),
      radial-gradient(700px 500px at 90% 100%, rgba(122,147,204,0.12), transparent 60%);
  }
  .hero-mark{
    width:88px; height:88px;
    border-radius:22px;
    background:linear-gradient(155deg, #fdfdfd 0%, #eef1f9 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 24px 50px -16px rgba(0,0,0,0.7);
    margin-bottom:28px;
    animation:markIn 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  .hero-mark img{ width:56px; height:56px; object-fit:contain; }
  @keyframes markIn{
    from{ opacity:0; transform:scale(.7) translateY(20px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  .hero h1{
    font-family:"Oswald", sans-serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 60px);
    margin:0;
    text-wrap:balance;
    letter-spacing:0.01em;
  }
  .hero h1 span{ color:var(--orange); }
  .hero .script{
    font-family:"Caveat", cursive;
    font-size:clamp(22px, 3.4vw, 30px);
    color:var(--steel);
    margin:10px 0 0;
  }
  .hero p.lede{
    max-width:52ch;
    margin:26px auto 0;
    font-size:16.5px;
    line-height:1.65;
    color:var(--ink-dim);
  }
  .hero .meta{
    margin-top:34px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .pill{
    font-family:"Oswald", sans-serif;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink);
    border:1px solid var(--surface-border);
    background:var(--surface);
    padding:8px 14px;
    border-radius:999px;
  }
  .pill-accent{ border-color:var(--orange); background:rgba(255,128,0,0.12); color:var(--orange); font-weight:600; }
  .scroll-hint{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--steel);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    animation:bob 2.2s ease-in-out infinite;
  }
  .scroll-hint svg{ width:14px; height:14px; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,6px);} }
  @media (prefers-reduced-motion: reduce){ .scroll-hint{ animation:none; } }

  /* ---- section heads ---- */
  .section-eyebrow{
    font-family:"Oswald", sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:10px;
  }
  h2{
    font-family:"Oswald", sans-serif;
    font-weight:700;
    font-size:clamp(24px,3.6vw,34px);
    margin:0 0 18px;
    text-wrap:balance;
  }
  .lead{
    font-size:16px;
    line-height:1.7;
    color:var(--ink-dim);
    max-width:65ch;
  }

  /* ---- problem stat ---- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:16px;
    margin-top:34px;
  }
  .stat-card{
    background:linear-gradient(165deg, var(--surface-raised) 0%, var(--surface) 100%);
    border:1px solid var(--surface-border);
    border-radius:16px;
    padding:22px 20px;
  }
  .stat-card .num{
    font-family:"Oswald", sans-serif;
    font-weight:700;
    font-size:34px;
    color:var(--orange);
    font-variant-numeric:tabular-nums;
  }
  .stat-card .lbl{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:6px;
    line-height:1.4;
  }

  /* ---- phone mockup ---- */
  .showcase{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:44px;
    align-items:center;
    margin-top:36px;
  }
  @media (max-width:720px){ .showcase{ grid-template-columns:1fr; } }

  .mini-phone{
    position:relative;
    background:linear-gradient(180deg, var(--surface) 0%, var(--navy-deep) 120%);
    border:1px solid var(--surface-border);
    border-radius:28px;
    padding:16px 14px 14px;
    box-shadow:0 40px 70px -26px rgba(0,0,0,0.75);
    justify-self:center;
  }

  .mini-tagline{
    font-family:"Caveat", cursive;
    color:#dfe6f7;
    font-size:17px;
    line-height:1;
    text-shadow:0 2px 3px rgba(0,0,0,0.95), 0 5px 14px rgba(0,0,0,0.9);
  }
  .mini-tagline b{ color:var(--orange); }
  .mini-greet{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .mini-avatar{
    width:44px; height:60px;
    border-radius:50% / 38%;
    border:1.5px solid rgba(244,246,252,0.5);
    background:rgba(5,9,28,0.35);
    flex:0 0 auto;
  }
  .mini-greet h3{
    font-family:"Oswald", sans-serif;
    font-size:16px;
    margin:0;
    text-shadow:0 3px 10px rgba(0,0,0,0.9);
  }
  .mini-greet p{
    font-family:"Cabin", sans-serif;
    font-style:italic;
    font-size:10.5px;
    color:var(--ink-dim);
    margin:3px 0 0;
    text-shadow:0 2px 6px rgba(0,0,0,0.9);
  }
  .mini-progress{ margin-top:16px; padding:0 14px; }
  .mini-progress .head{ display:flex; justify-content:space-between; font-family:"Oswald",sans-serif; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--steel); }
  .mini-progress .head b{ color:var(--orange); font-size:12px; }
  .mini-track{ height:6px; border-radius:4px; background:var(--surface-raised); margin-top:6px; overflow:hidden; }
  .mini-fill{ height:100%; width:20%; border-radius:4px; background:linear-gradient(90deg,#ff8000,#ffab42); animation:fillGrow 1.4s 400ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fillGrow{ from{ width:0%; } to{ width:20%; } }

  .mini-cards{ padding:16px 14px 6px; display:flex; flex-direction:column; gap:8px; }
  .mini-card{
    background:linear-gradient(165deg, #22337a 0%, var(--surface) 60%, #0a1230 100%);
    border:1px solid rgba(122,147,204,0.3);
    border-radius:12px;
    padding:11px 12px;
    display:flex; gap:9px; align-items:center;
  }
  .mini-card img{ width:30px; height:30px; border-radius:8px; object-fit:cover; flex:0 0 auto; }
  .mini-card .t{ font-family:"Oswald",sans-serif; font-size:11px; }
  .mini-card .d{ font-family:"Cabin",sans-serif; font-size:8.5px; color:var(--steel); margin-top:2px; }
  .mini-row{ display:flex; align-items:center; gap:8px; opacity:0.55; padding:2px 4px; }
  .mini-row .dot{ width:15px; height:15px; border-radius:50%; border:1px solid var(--surface-border); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-family:"Oswald",sans-serif; font-size:8px; color:var(--steel); }
  .mini-row .t{ font-family:"Cabin",sans-serif; font-size:9.5px; color:var(--ink-dim); }

  .showcase-copy ul{ list-style:none; margin:22px 0 0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .showcase-copy li{ display:flex; gap:12px; align-items:flex-start; }
  .check{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:rgba(255,128,0,0.16); border:1px solid rgba(255,128,0,0.5); display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .check svg{ width:11px; height:11px; }
  .showcase-copy li span{ font-size:14.5px; color:var(--ink-dim); line-height:1.55; }
  .showcase-copy li strong{ color:var(--ink); }

  /* ---- roadmap ---- */
  .roadmap{ margin-top:34px; display:flex; flex-direction:column; gap:14px; }
  .rm-row{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:18px;
    padding:20px;
    border-radius:14px;
    border:1px solid var(--surface-border);
    background:var(--surface);
  }
  .rm-row.now{ border-color:rgba(255,128,0,0.5); background:linear-gradient(165deg, var(--surface) 0%, rgba(255,128,0,0.08) 160%); }
  @media (max-width:560px){ .rm-row{ grid-template-columns:1fr; } }
  .rm-tag{ font-family:"Oswald",sans-serif; font-weight:700; font-size:13px; color:var(--orange); }
  .rm-tag small{ display:block; font-family:"Cabin",sans-serif; font-weight:400; font-style:italic; color:var(--steel); font-size:11px; margin-top:2px; }
  .rm-body h4{ margin:0 0 6px; font-family:"Oswald",sans-serif; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rm-badge{
    font-family:"Oswald",sans-serif; font-weight:600; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; background:var(--orange); color:var(--orange-ink);
  }
  .rm-badge-later{ background:transparent; border:1px solid var(--surface-border); color:var(--steel); }
  .rm-body p{ margin:0; font-size:13.5px; color:var(--ink-dim); line-height:1.55; }

  /* ---- CTA ---- */
  .cta{
    text-align:center;
  }
  .cta .card{
    background:linear-gradient(165deg, var(--surface-raised) 0%, var(--surface) 100%);
    border:1px solid rgba(255,128,0,0.4);
    border-radius:22px;
    padding:48px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .cta h2{ margin-bottom:12px; }
  .cta .sign{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:36px;
    flex-wrap:wrap;
    font-family:"Oswald", sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--steel);
  }
  .cta .sign b{ display:block; color:var(--ink); font-family:"Cabin",sans-serif; text-transform:none; letter-spacing:0; font-size:15px; margin-top:4px; }

  /* ---- feedback / Rückmeldung ---- */
  .fb-list{ display:flex; flex-direction:column; gap:14px; margin:28px 0 0; }
  .fb-item{
    text-align:left;
    background:linear-gradient(165deg, var(--surface-raised) 0%, var(--surface) 100%);
    border:1px solid var(--surface-border);
    border-radius:14px;
    padding:16px 18px;
  }
  .fb-item.is-approved{ border-color:rgba(255,128,0,0.5); }
  .fb-item .row1{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .fb-badge{
    font-family:"Oswald",sans-serif; font-weight:600; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    padding:5px 11px; border-radius:999px;
  }
  .fb-badge.approve{ background:rgba(255,128,0,0.18); color:var(--orange); border:1px solid rgba(255,128,0,0.5); }
  .fb-badge.revise{ background:rgba(122,147,204,0.14); color:var(--steel); border:1px solid var(--surface-border); }
  .fb-who{ font-family:"Oswald",sans-serif; font-size:15px; color:var(--ink); }
  .fb-when{ font-size:12.5px; color:var(--steel); }
  .fb-text{ margin:10px 0 0; font-size:16px; color:var(--ink-dim); line-height:1.6; }
  .fb-empty{ font-size:16px; color:var(--steel); font-style:italic; text-align:left; margin-top:24px; }

  .fb-form{
    text-align:left;
    margin-top:26px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:16px;
    padding:22px;
  }
  .fb-form label{ display:block; font-family:"Oswald",sans-serif; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel); margin-bottom:8px; }
  .fb-form input[type=text], .fb-form textarea{
    width:100%; background:var(--navy-deep); border:1px solid var(--surface-border); border-radius:10px;
    color:var(--ink); font-family:"Cabin",sans-serif; font-size:16px; padding:12px 13px; margin-bottom:18px;
  }
  .fb-form textarea{ min-height:90px; resize:vertical; }
  .fb-toggle{ display:flex; gap:10px; margin-bottom:20px; }
  .fb-toggle button{
    flex:1; cursor:pointer; font-family:"Oswald",sans-serif; font-weight:600; font-size:14px; letter-spacing:0.04em;
    padding:13px; border-radius:10px; border:1.5px solid var(--surface-border); background:var(--navy-deep); color:var(--ink-dim);
    transition:all 150ms ease;
  }
  .fb-toggle button.is-active[data-val="approve"]{ background:var(--orange); border-color:var(--orange); color:var(--orange-ink); }
  .fb-toggle button.is-active[data-val="revise"]{ background:var(--steel); border-color:var(--steel); color:var(--navy-deep); }
  .fb-submit{
    width:100%; cursor:pointer; font-family:"Oswald",sans-serif; font-weight:600; font-size:14.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:15px; border-radius:10px; border:none; background:var(--orange); color:var(--orange-ink);
  }
  .fb-submit:disabled{ opacity:0.5; cursor:not-allowed; }
  .fb-note{ font-size:13.5px; color:var(--steel); margin-top:12px; text-align:center; }
  .fb-hint{ font-size:15px; color:var(--ink-dim); margin:6px 0 0; }

  .fb-thanks{
    text-align:left;
    margin-top:26px;
    background:linear-gradient(165deg, var(--surface-raised) 0%, var(--surface) 100%);
    border:1px solid rgba(255,128,0,0.5);
    border-radius:16px;
    padding:26px 24px;
    display:flex;
    gap:16px;
    align-items:flex-start;
    animation:thanksIn 500ms cubic-bezier(.2,.8,.2,1);
  }
  @keyframes thanksIn{ from{ opacity:0; transform:translateY(10px) scale(.98);} to{ opacity:1; transform:none;} }
  .fb-thanks-check{
    flex:none; width:38px; height:38px; border-radius:50%;
    background:var(--orange); color:var(--orange-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700;
    animation:markIn 480ms cubic-bezier(.2,.9,.3,1.3) 120ms both;
  }
  .fb-thanks-text{ font-size:16px; color:var(--ink-dim); line-height:1.6; padding-top:4px; }
  .fb-thanks-text b{ color:var(--ink); }
  .fb-again{
    margin-top:16px;
    background:none; border:1.5px solid var(--surface-border); color:var(--steel);
    font-family:"Oswald",sans-serif; font-weight:600; font-size:13px; letter-spacing:0.05em; text-transform:uppercase;
    padding:11px 16px; border-radius:10px; cursor:pointer;
  }
  .fb-again:hover{ border-color:var(--orange); color:var(--orange); }
  .fb-item.is-new{
    border-color:var(--orange);
    box-shadow:0 0 0 1px rgba(255,128,0,0.3);
    animation:thanksIn 500ms cubic-bezier(.2,.8,.2,1);
  }
</style>
</head>

<section>
  <div class="section-eyebrow reveal">Das Problem</div>
  <h2 class="reveal">Jede Einarbeitung kostet Zeit, die für Strategie fehlt.</h2>
  <p class="lead reveal">Im laVital-Fitnessbereich herrscht naturgegeben hohe Personalfluktuation. Jede Einarbeitung eines neuen Mitarbeiters bindet persönliche Zeit der Bereichsleitung &mdash; Zeit, die dann für Marketing, Kommunikation und strategische Arbeit fehlt. Der Wunsch nach einem digitalen Ansprechpartner pro Abteilung kam sogar schon von der Geschäftsführung selbst.</p>

    var draft = { name:'', decision:null, text:'' };

    var again = document.getElementById('fb-again');
    if(again){
      again.addEventListener('click', function(){
        section.innerHTML = renderFeedbackSection();
        wireForm();
      });
      return;
    }

    function reflectDraft(){
      var submit = document.getElementById('fb-submit');
      submit.disabled = !draft.decision;
    }

    section.querySelectorAll('.fb-toggle button').forEach(function(btn){
      btn.addEventListener('click', function(){
        draft.decision = btn.getAttribute('data-val');
        section.querySelectorAll('.fb-toggle button').forEach(function(b){ b.classList.toggle('is-active', b === btn); });
        reflectDraft();
      });
    });
    var nameEl = document.getElementById('fb-name');
    var textEl = document.getElementById('fb-text');
    nameEl.addEventListener('input', function(){ draft.name = nameEl.value; });
    textEl.addEventListener('input', function(){ draft.text = textEl.value; });

    document.getElementById('fb-submit').addEventListener('click', function(){
      if(!draft.decision) return;

      var name = draft.name.trim();
      var decisionLabel = draft.decision === 'approve' ? 'Genehmigt' : 'Bitte überarbeiten';
      var subject = 'Rückmeldung: laVital START Antrag' + (name ? ' – ' + name : '');
      var body = 'Name: ' + (name || '(nicht angegeben)') + '\n'
        + 'Entscheidung: ' + decisionLabel + '\n'
        + 'Kommentar: ' + (draft.text.trim() || '(kein Kommentar)');
      var mailto = 'mailto:' + ANNETT_MAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      window.location.href = mailto;

      section.innerHTML = renderFeedbackSection({justSubmitted: {name: name}});
      wireForm();
    });
  }

  // initial paint: inject static sections, then feedback section
  document.getElementById('mount') || (function(){
    var mount = document.createElement('div');
    mount.id = 'mount';
    document.getElementById('feedback-section').before(mount);
  })();
  document.getElementById('mount').innerHTML = document.getElementById('static-body').innerHTML;
  document.getElementById('feedback-section').innerHTML = renderFeedbackSection();
  wireForm();

  // alles sofort sichtbar -- kein scroll-getriggertes Reveal mehr (Ursache für hängendes Scrollen auf Mobilgeräten)
  document.querySelectorAll('.reveal:not(.is-visible)').forEach(function(el){ el.classList.add('is-visible'); });
})();
</script>
</body>
</html>
